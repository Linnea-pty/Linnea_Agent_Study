[project]
name = "Linnea_Agent_Study"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "gradio>=6.31.0",
    "langchain>=1.4.8",
    "langchain-openai>=1.7.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.19",
    "playwright>=1.64.1",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false

[project.scripts]
linnea-agent = "app.main:run_web"
linnea-agent-cli = "app.main:run_cli"